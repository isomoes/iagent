# Publish @isomoes/iagent to npm when a vX.Y.Z tag is pushed.
#
# This is the entry point of the release pipeline: the tag triggers this, and
# release.yml chains off it via `workflow_run` to cut the GitHub Release only
# after this publish succeeds. So a failed publish never produces a Release for
# a version that isn't on npm.
#
# Auth is npm "trusted publishing" via OIDC — no NPM_TOKEN secret. One-time setup
# on npmjs.com (Package settings → Trusted publishing) must register:
#   Repository : isomoes/iagent
#   Workflow   : .github/workflows/publish.yml
#   Environment: (leave blank — none is used below)
# Do this after the package's first manual `npm publish` so it exists to configure.
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bun: package manager + the build (Bun.build bundle + vite client build).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node + npm: the publish itself (npm is the reference impl for OIDC
      # trusted publishing). registry-url writes the npmjs .npmrc.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; Node 22 ships an older npm.
      - name: Upgrade npm
        run: npm install --global npm@latest

      - name: Install workspace
        run: bun install --frozen-lockfile

      # Gate: never publish a tree that doesn't typecheck.
      - name: Typecheck
        run: bun run typecheck

      # Stamp the package version from the pushed tag (vX.Y.Z -> X.Y.Z).
      # `npm pkg set` is a pure package.json edit; `npm version` would try to
      # reconcile the dependency tree and dies on the `workspace:*` devDeps
      # (npm doesn't understand Bun's workspace protocol run standalone here).
      - name: Set version from tag
        working-directory: packages/cli
        env:
          TAG: ${{ github.ref_name }}
        run: npm pkg set version="${TAG#v}"

      # `npm publish` runs the package's prepack (bun run build.ts) to produce
      # dist/, then publishes. No token: OIDC supplies short-lived credentials
      # and provenance is attached automatically.
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
